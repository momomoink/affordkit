name: affordkit
description: Your Flutter app's UI, for AI agents to see and use. Widgets become a tree with the operations you'd expect of them, and agents act on it under your app's policies.
version: 0.1.0
repository: https://github.com/momomoink/affordkit/tree/main/flutter
issue_tracker: https://github.com/momomoink/affordkit/issues
# (until the first release on pub.dev)
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
