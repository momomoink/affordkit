<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" fill="none" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- How AffordKit works. What AffordKit gives you is drawn solid, in violet: the kit in the app (it builds the AffordTree and
       answers requests) and AffordRemote on the server (the screen as tools). What is yours is drawn dashed: your UI, your agent
       (the model, its loop and prompt, or an agent like Claude Code) and the channel between app and server. -->
  <defs>
    <marker id="v" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" stroke="#8C77FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" stroke="#F2C14E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" stroke="#6E62C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="580" rx="24" fill="#14112B"/>

  <!-- ================= Frontend: in your app ================= -->
  <text x="40" y="46" font-size="12" font-weight="600" letter-spacing="0.8" fill="#8F88C6">FRONTEND · IN YOUR APP</text>
  <rect x="40" y="60" width="380" height="448" rx="22" fill="#1E1A3D" stroke="#2F2961" stroke-width="1.5"/>

  <!-- your UI: yours -->
  <g transform="translate(64 80)">
    <rect width="332" height="88" rx="16" fill="#1E1A3D" stroke="#6E62C9" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="16" y="24" font-size="13.5" font-weight="600" fill="#EEEBFF">Your UI</text>
    <rect x="16" y="40" width="96" height="30" rx="8" fill="#1E1A3D" stroke="#3F3775" stroke-width="1.5"/>
    <rect x="28" y="52" width="52" height="6" rx="3" fill="#5A4FB0"/>
    <rect x="122" y="40" width="96" height="30" rx="8" fill="#1E1A3D" stroke="#3F3775" stroke-width="1.5"/>
    <rect x="134" y="50" width="60" height="5" rx="2.5" fill="#5A4FB0"/>
    <rect x="134" y="59" width="40" height="4" rx="2" fill="#3F3775"/>
    <rect x="228" y="40" width="88" height="30" rx="15" fill="#EEEBFF"/>
    <text x="272" y="59.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F1A4E">Reply</text>
  </g>

  <!-- AffordKit in the app: ours -->
  <g transform="translate(64 186)">
    <rect width="332" height="234" rx="16" fill="#1E1A3D" stroke="#8C77FF" stroke-width="2"/>
    <text x="16" y="26" font-size="13.5" font-weight="700" fill="#A898FF">AffordKit</text>
    <text x="316" y="26" text-anchor="end" font-size="12" fill="#9C95CF">builds the tree, runs the calls</text>

    <!-- the AffordTree -->
    <rect x="16" y="40" width="300" height="104" rx="12" fill="#29234F"/>
    <text x="30" y="61" font-size="12.5" font-weight="700" fill="#EEEBFF">AffordTree</text>
    <text x="302" y="61" text-anchor="end" font-size="11" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#8F88C6">kit.context()</text>
    <path d="M34 72 V128 M34 84 H42 M34 106 H42 M34 128 H42" stroke="#5A4FB0" stroke-width="1.5" stroke-linecap="round"/>
    <g font-size="11" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace">
      <rect x="46" y="75" width="256" height="18" rx="9" fill="#1E1A3D"/>
      <text x="56" y="88" fill="#EEEBFF">textbox "Search" · write</text>
      <rect x="46" y="97" width="256" height="18" rx="9" fill="#1E1A3D"/>
      <text x="56" y="110" fill="#EEEBFF">list "Inbox" · 312 entries</text>
      <rect x="46" y="119" width="256" height="18" rx="9" fill="#3A3016"/>
      <text x="56" y="132" fill="#EEEBFF">button "Reply" · press</text>
    </g>

    <!-- your rules, and what the kit keeps -->
    <g font-size="11.5" font-weight="600">
      <rect x="16" y="156" width="52" height="24" rx="12" fill="#123327"/>
      <text x="42" y="172" text-anchor="middle" fill="#5FD39A">allow</text>
      <rect x="74" y="156" width="64" height="24" rx="12" fill="#3A3016"/>
      <text x="106" y="172" text-anchor="middle" fill="#F2C14E">confirm</text>
      <rect x="144" y="156" width="48" height="24" rx="12" fill="#3A1823"/>
      <text x="168" y="172" text-anchor="middle" fill="#FF8FA3">deny</text>
      <text x="204" y="172" font-weight="400" fill="#9C95CF">your rules, kept</text>
    </g>
    <g font-size="11" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#C9C3F0">
      <rect x="16" y="190" width="68" height="24" rx="12" fill="#29234F"/>
      <text x="50" y="206" text-anchor="middle">routes</text>
      <rect x="90" y="190" width="64" height="24" rx="12" fill="#29234F"/>
      <text x="122" y="206" text-anchor="middle">settle</text>
      <rect x="160" y="190" width="84" height="24" rx="12" fill="#29234F"/>
      <text x="202" y="206" text-anchor="middle">watchUser</text>
      <rect x="250" y="190" width="66" height="24" rx="12" fill="#29234F"/>
      <text x="283" y="206" text-anchor="middle">onAct</text>
    </g>
  </g>
  <path d="M230 170 V184" stroke="#6E62C9" stroke-width="2" stroke-linecap="round" marker-end="url(#g)"/>

  <!-- the port: ours -->
  <g transform="translate(244 436)">
    <rect width="176" height="34" rx="17" fill="#4B2FD1"/>
    <text x="88" y="22" text-anchor="middle" font-size="12" font-weight="600" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#FFFFFF">kit.answer(request)</text>
  </g>

  <!-- ================= Between: your channel ================= -->
  <text x="500" y="300" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="0.8" fill="#8F88C6">YOUR CHANNEL</text>
  <text x="500" y="318" text-anchor="middle" font-size="12" fill="#9C95CF">WebSocket, HTTP, …</text>

  <!-- request: from the server to the app -->
  <path d="M572 412 H436" stroke="#F2C14E" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#s)"/>
  <g transform="translate(436 358)">
    <text x="68" y="0" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#F2C14E">UiRequest</text>
    <text x="68" y="18" text-anchor="middle" font-size="11.5" fill="#9C95CF">look, or calls:</text>
    <text x="68" y="34" text-anchor="middle" font-size="11.5" fill="#9C95CF">press · write · navigate</text>
  </g>

  <!-- answer: from the app to the server -->
  <path d="M424 456 H560" stroke="#8C77FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#v)"/>
  <g transform="translate(428 478)">
    <text x="68" y="0" text-anchor="middle" font-size="12" font-weight="700" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#A898FF">UiAnswer</text>
    <text x="68" y="18" text-anchor="middle" font-size="11.5" fill="#9C95CF">the tree after, results,</text>
    <text x="68" y="34" text-anchor="middle" font-size="11.5" fill="#9C95CF">what the user did</text>
  </g>

  <!-- ================= Backend: your server ================= -->
  <text x="580" y="46" font-size="12" font-weight="600" letter-spacing="0.8" fill="#8F88C6">BACKEND · YOUR SERVER</text>
  <rect x="580" y="60" width="380" height="448" rx="22" fill="#1E1A3D" stroke="#2F2961" stroke-width="1.5"/>

  <!-- your agent: yours -->
  <g transform="translate(604 80)">
    <rect width="332" height="100" rx="16" fill="#1E1A3D" stroke="#6E62C9" stroke-width="1.5" stroke-dasharray="5 5"/>
    <g transform="translate(36 50)">
      <path d="M0 -17 C2.4 -5.6 5.6 -2.4 17 0 C5.6 2.4 2.4 5.6 0 17 C-2.4 5.6 -5.6 2.4 -17 0 C-5.6 -2.4 -2.4 -5.6 0 -17 Z" fill="#FFC233"/>
    </g>
    <text x="68" y="38" font-size="13.5" font-weight="700" fill="#EEEBFF">Your agent</text>
    <text x="68" y="57" font-size="12" fill="#9C95CF">your model, loop and prompt, or an agent</text>
    <text x="68" y="74" font-size="12" fill="#9C95CF">like Claude Code or Codex</text>
  </g>

  <!-- between them: the screen tools, in the agent's shape -->
  <path d="M770 184 V230" stroke="#6E62C9" stroke-width="2" stroke-linecap="round" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="784" y="203" font-size="12" fill="#9C95CF">tool calls ⇄ results,</text>
  <text x="784" y="219" font-size="12" fill="#9C95CF">in its shape</text>

  <!-- AffordRemote: ours -->
  <g transform="translate(604 236)">
    <rect width="332" height="184" rx="16" fill="#1E1A3D" stroke="#8C77FF" stroke-width="2"/>
    <text x="16" y="26" font-size="13.5" font-weight="700" fill="#A898FF">AffordRemote</text>
    <text x="316" y="26" text-anchor="end" font-size="12" fill="#9C95CF">the screen as tools</text>
    <g font-size="11" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#EEEBFF">
      <rect x="16" y="40" width="70" height="22" rx="11" fill="#29234F"/>
      <text x="51" y="55" text-anchor="middle">ui_look</text>
      <rect x="92" y="40" width="62" height="22" rx="11" fill="#29234F"/>
      <text x="123" y="55" text-anchor="middle">ui_act</text>
      <rect x="160" y="40" width="92" height="22" rx="11" fill="#29234F"/>
      <text x="206" y="55" text-anchor="middle">ui_navigate</text>
      <rect x="16" y="68" width="70" height="22" rx="11" fill="#29234F"/>
      <text x="51" y="83" text-anchor="middle">ui_peek</text>
      <rect x="92" y="68" width="70" height="22" rx="11" fill="#29234F"/>
      <text x="127" y="83" text-anchor="middle">ui_tool</text>
      <rect x="168" y="68" width="92" height="22" rx="11" fill="#29234F"/>
      <text x="214" y="83" text-anchor="middle">ui_handoff</text>
    </g>
    <text x="16" y="118" font-size="12" fill="#C9C3F0">for the Anthropic and OpenAI APIs, or MCP</text>
    <path d="M16 132 H316" stroke="#2F2961" stroke-width="1.5"/>
    <text x="16" y="152" font-size="12" fill="#C9C3F0">answers as text: what changed on screen,</text>
    <text x="16" y="168" font-size="12" fill="#C9C3F0">what the user did, why a step failed</text>
  </g>

  <!-- the port: ours -->
  <g transform="translate(580 436)">
    <rect width="190" height="34" rx="17" fill="#4B2FD1"/>
    <text x="95" y="22" text-anchor="middle" font-size="12" font-weight="600" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#FFFFFF">send(request)</text>
  </g>

  <!-- ================= Packages, and the key ================= -->
  <g font-size="11.5" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" fill="#C9C3F0">
    <rect x="40" y="520" width="176" height="26" rx="13" fill="#1E1A3D" stroke="#2F2961" stroke-width="1.5"/>
    <text x="128" y="537" text-anchor="middle">Flutter · affordkit</text>
    <rect x="224" y="520" width="196" height="26" rx="13" fill="#1E1A3D" stroke="#2F2961" stroke-width="1.5"/>
    <text x="322" y="537" text-anchor="middle">Web · affordkit/dom</text>
    <rect x="580" y="520" width="188" height="26" rx="13" fill="#1E1A3D" stroke="#2F2961" stroke-width="1.5"/>
    <text x="674" y="537" text-anchor="middle">Node · affordkit</text>
  </g>
  <g font-size="12" fill="#C9C3F0">
    <rect x="800" y="524" width="18" height="18" rx="5" fill="#1E1A3D" stroke="#8C77FF" stroke-width="2"/>
    <text x="826" y="537">AffordKit</text>
    <rect x="894" y="524" width="18" height="18" rx="5" fill="#1E1A3D" stroke="#6E62C9" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="920" y="537">yours</text>
  </g>
</svg>
