<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" fill="none" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- AffordKit, the idea: an AI agent on a backend sees your app's screen as a small tree, and acts on it with calls your app runs -->
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" stroke="#8C77FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </marker>
    <marker id="head-sun" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" stroke="#F2C14E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="24" fill="#14112B"/>

  <!-- ============ Your app ============ -->
  <text x="150" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#EEEBFF">Your app</text>
  <g transform="translate(60 76)">
    <rect width="180" height="268" rx="22" fill="#1E1A3D" stroke="#2F2961" stroke-width="1.5"/>
    <!-- title -->
    <rect x="20" y="24" width="72" height="10" rx="5" fill="#EEEBFF" opacity="0.85"/>
    <circle cx="152" cy="29" r="7" fill="#2B2556"/>
    <!-- a list -->
    <rect x="20" y="56" width="140" height="34" rx="10" fill="#29234F"/>
    <rect x="32" y="66" width="70" height="6" rx="3" fill="#6E62C9"/>
    <rect x="32" y="77" width="96" height="5" rx="2.5" fill="#3F3775"/>
    <rect x="20" y="98" width="140" height="34" rx="10" fill="#29234F"/>
    <rect x="32" y="108" width="58" height="6" rx="3" fill="#6E62C9"/>
    <rect x="32" y="119" width="84" height="5" rx="2.5" fill="#3F3775"/>
    <!-- a text field -->
    <rect x="20" y="148" width="140" height="34" rx="10" fill="#1E1A3D" stroke="#3F3775" stroke-width="1.5"/>
    <rect x="32" y="162" width="64" height="6" rx="3" fill="#5A4FB0"/>
    <!-- a button, the one being pressed -->
    <rect x="20" y="198" width="140" height="38" rx="19" fill="#4B2FD1"/>
    <text x="90" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Reply</text>
    <circle cx="138" cy="217" r="11" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="138" cy="217" r="4.5" fill="#FFC233"/>
  </g>
  <text x="150" y="372" text-anchor="middle" font-size="12.5" fill="#9C95CF">Flutter or the web</text>

  <!-- ============ AffordKit, in the middle ============ -->
  <g transform="translate(330 70)">
    <rect width="300" height="280" rx="24" fill="#1E1A3D" stroke="#2F2961" stroke-width="1.5"/>
    <!-- the mark -->
    <g transform="translate(26 22) scale(0.1)">
      <path d="M23 225.65L140 23L257 225.65" stroke-width="30" stroke-linecap="round" stroke="#8C77FF"/>
      <circle cx="140" cy="23" r="26" fill="#4B2FD1"/>
      <circle cx="23" cy="225.65" r="26" fill="#4B2FD1"/>
      <circle cx="257" cy="225.65" r="26" fill="#4B2FD1"/>
      <rect x="110" y="131" width="60" height="60" rx="16" fill="#FFC233"/>
    </g>
    <text x="64" y="44" font-size="17" font-weight="700" fill="#EEEBFF">AffordKit</text>

    <!-- what the agent sees: the AffordTree -->
    <text x="26" y="86" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#8F88C6">THE AFFORDTREE</text>
    <path d="M34 104 V182 M34 124 H48 M34 153 H48 M34 182 H48" stroke="#3F3775" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="34" cy="104" r="4" fill="#4B2FD1"/>
    <g font-size="12.5">
      <rect x="52" y="112" width="222" height="24" rx="12" fill="#29234F"/>
      <text x="64" y="128" fill="#EEEBFF"><tspan font-weight="600">list</tspan> “Inbox” · 312</text>
      <rect x="52" y="141" width="222" height="24" rx="12" fill="#29234F"/>
      <text x="64" y="157" fill="#EEEBFF"><tspan font-weight="600">textbox</tspan> “Subject” · write</text>
      <rect x="52" y="170" width="222" height="24" rx="12" fill="#3A3016"/>
      <text x="64" y="186" fill="#EEEBFF"><tspan font-weight="600">button</tspan> “Reply” · press</text>
    </g>

    <!-- what it may do: the app's rules -->
    <text x="26" y="228" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#8F88C6">YOUR RULES</text>
    <g font-size="12" font-weight="600">
      <rect x="26" y="238" width="62" height="24" rx="12" fill="#123327"/>
      <text x="57" y="254" text-anchor="middle" fill="#5FD39A">allow</text>
      <rect x="96" y="238" width="74" height="24" rx="12" fill="#3A3016"/>
      <text x="133" y="254" text-anchor="middle" fill="#F2C14E">confirm</text>
      <rect x="178" y="238" width="56" height="24" rx="12" fill="#3A1823"/>
      <text x="206" y="254" text-anchor="middle" fill="#FF8FA3">deny</text>
    </g>
  </g>

  <!-- ============ The agent ============ -->
  <text x="810" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#EEEBFF">An AI agent</text>
  <g transform="translate(720 76)">
    <rect width="180" height="268" rx="22" fill="#4B2FD1" stroke="#6A52F0" stroke-width="1.5"/>
    <!-- a sparkle -->
    <g transform="translate(90 112)">
      <circle r="46" fill="#FFFFFF" opacity="0.08"/>
      <path d="M0 -30 C4 -10 10 -4 30 0 C10 4 4 10 0 30 C-4 10 -10 4 -30 0 C-10 -4 -4 -10 0 -30 Z" fill="#FFC233"/>
      <path d="M30 -30 C31.5 -24 34 -21.5 40 -20 C34 -18.5 31.5 -16 30 -10 C28.5 -16 26 -18.5 20 -20 C26 -21.5 28.5 -24 30 -30 Z" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <text x="90" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">on your backend</text>
    <text x="90" y="220" text-anchor="middle" font-size="12" fill="#CFC6FF">Claude, GPT, any model</text>
  </g>
  <text x="810" y="372" text-anchor="middle" font-size="12.5" fill="#9C95CF">a goal: “reply to Wang”</text>

  <!-- ============ The two ways ============ -->
  <!-- sees: the screen goes up as a tree -->
  <path d="M248 150 H318" stroke="#8C77FF" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
  <path d="M642 150 H708" stroke="#8C77FF" stroke-width="2" stroke-linecap="round" marker-end="url(#head)"/>
  <!-- acts: calls come back, the app runs them -->
  <path d="M708 296 H642" stroke="#F2C14E" stroke-width="2" stroke-linecap="round" marker-end="url(#head-sun)"/>
  <path d="M318 296 H248" stroke="#F2C14E" stroke-width="2" stroke-linecap="round" marker-end="url(#head-sun)"/>

  <g font-size="11.5" font-weight="600" letter-spacing="0.4" text-anchor="middle">
    <text x="283" y="138" fill="#A898FF">the screen</text>
    <text x="675" y="138" fill="#A898FF">the tree</text>
    <text x="675" y="318" fill="#F2C14E">calls</text>
    <text x="283" y="318" fill="#F2C14E">runs them</text>
  </g>

  <text x="480" y="397" text-anchor="middle" font-size="14" fill="#C9C3F0">The agent sees your screen as a tree, and acts on it under your rules.</text>
</svg>
