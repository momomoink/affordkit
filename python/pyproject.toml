[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "affordkit"
version = "0.1.0"
description = "AffordKit's agent side for Python: give your model an app's screen as tools (Anthropic, OpenAI, MCP), over any transport."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rusheng Zhang" }]
keywords = ["ai", "agent", "ui", "accessibility", "automation", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/momomoink/affordkit"
Repository = "https://github.com/momomoink/affordkit"
Issues = "https://github.com/momomoink/affordkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/affordkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
